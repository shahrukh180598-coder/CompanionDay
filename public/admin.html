<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CompanionDay Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f6f4f3;color:#191719}.top{height:70px;background:#191719;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 6%}.logo{font-weight:900;font-size:22px}.logo b{color:#e54878}.wrap{max-width:1150px;margin:auto;padding:35px 20px}.panel{background:#fff;border:1px solid #e8e4e2;border-radius:18px;padding:20px}.login{max-width:400px;margin:80px auto}.input,.form textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.dark{background:#191719;color:#fff}.pink{background:#e54878;color:#fff}.grid{display:grid;grid-template-columns:320px 1fr;gap:20px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{border:1px solid #eee;border-radius:15px;overflow:hidden}.pic{height:180px;background:#e9d7da;display:flex;justify-content:center;align-items:center;font-size:70px}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.tag{font-size:11px;background:#f4eef0;padding:5px 8px;border-radius:20px;margin:2px;display:inline-block}.hidden{display:none}@media(max-width:800px){.grid,.cards{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="logo">Companion<b>Day</b> ADMIN</div><button class="btn" onclick="logout()">Logout</button></header>
<div id="login" class="panel login"><h2>Admin login</h2><input class="input" id="u" placeholder="Username"><input class="input" id="p" type="password" placeholder="Password"><button class="btn dark" style="width:100%;margin-top:8px" onclick="signin()">Sign in</button><p id="msg"></p></div>
<main id="app" class="wrap hidden"><h1>Admin dashboard</h1><div class="grid"><div class="panel"><h2>Add companion</h2><input class="input" id="name" placeholder="Name"><input class="input" id="age" type="number" min="18" placeholder="Age (18+)"><input class="input" id="city" placeholder="City"><input class="input" id="price" type="number" placeholder="Hourly price ₹"><input class="input" id="activities" placeholder="Shopping, Dinner, Movie"><textarea class="input" id="bio" placeholder="Bio"></textarea><input class="input" id="photo" type="file" accept="image/jpeg,image/png,image/webp"><label><input id="ver" type="checkbox"> Verified</label><button class="btn pink" style="width:100%;margin-top:10px" onclick="add()">Add profile</button><p id="am"></p></div>
<div class="panel"><h2>Companion profiles</h2><div class="cards" id="cards"></div></div></div><div class="panel" style="margin-top:20px"><h2>Booking requests</h2><div id="bookings">Loading…</div></div></main>
<script>
const $=x=>document.getElementById(x);async function check(){let d=await(await fetch('/api/admin/me')).json();if(d.admin){$('login').classList.add('hidden');$('app').classList.remove('hidden');load();loadBookings()}}async function signin(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})}),d=await r.json();if(!r.ok){$('msg').textContent=d.error;return}check()}async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload()}
async function add(){if(Number($('age').value)<18){$('am').textContent='Age must be 18+';return}let f=new FormData();['name','age','city','price','activities','bio'].forEach(k=>f.append(k,$(k).value));f.append('verified',$('ver').checked?'1':'0');if($('photo').files[0])f.append('photo',$('photo').files[0]);let r=await fetch('/api/admin/companions',{method:'POST',body:f}),d=await r.json();$('am').textContent=r.ok?'Added successfully':d.error;if(r.ok){$('photo').value='';load()}}
async function load(){let a=await(await fetch('/api/companions')).json();$('cards').innerHTML=a.map(c=>`<div class="card"><div class="pic">${c.photo?`<img src="${c.photo}">`:'🧑🏻'}</div><div class="body"><b>${esc(c.name)}, ${c.age}</b><p style="font-size:12px;color:#777">${esc(c.city)} · ₹${c.price}/hr</p>${c.verified?'<span class="tag">✓ Verified</span>':''}<button class="btn" onclick="toggle(${c.id},${c.verified?0:1})">${c.verified?'Unverify':'Verify'}</button> <button class="btn" onclick="del(${c.id})">Delete</button></div></div>`).join('')||'No profiles yet.'}
async function toggle(id,v){await fetch('/api/admin/companions/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({verified:v})});load()}async function del(id){if(confirm('Delete profile?')){await fetch('/api/admin/companions/'+id,{method:'DELETE'});load()}}
async function loadBookings(){let a=await(await fetch('/api/admin/bookings')).json();$('bookings').innerHTML=a.map(b=>`<div style="padding:10px 0;border-bottom:1px solid #eee;font-size:13px"><b>${esc(b.user_name)}</b> requested <b>${esc(b.companion_name)}</b> · ${esc(b.booking_date)} · ${b.hours} hrs · ${b.phone}</div>`).join('')||'No bookings yet.'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}check()
</script></body></html>
